
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plant Doctor - AI Leaf Diagnosis</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- TensorFlow.js and Teachable Machine Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="icon" href="gorge.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="off plan.css">
</head>
<body class="p-4 md:p-8 flex items-center justify-center min-h-screen">

    <div class="max-w-4xl w-full bg-white rounded-2xl shadow-xl overflow-hidden flex flex-col md:flex-row border border-green-100">

        <!-- Left Column: Controls & Upload -->
        <div class="w-full md:w-1/2 p-6 md:p-8 border-b md:border-b-0 md:border-r border-gray-100 flex flex-col justify-between">
            <div>
                <!-- Header -->
                <div class="flex items-center space-x-3 mb-2">
                    <div class="w-10 h-10 rounded-xl bg-green-700 text-white flex items-center justify-center text-xl shadow-md">
                        🌱
                    </div>
                    <h1 class="text-2xl font-bold text-gray-800">Plant Doctor</h1>
                </div>

                <!-- Model Selection Buttons -->
                <div class="flex gap-1.5 mb-2">
                    <button
                        onclick="loadCustomModel('https://teachablemachine.withgoogle.com/models/i9LKfalBl/', 'Tomato')"
                        class="bg-white border border-blue-600 text-blue-700 hover:bg-orange-400 hover:text-white px-3 py-1.5 rounded-lg text-xs font-semibold shadow-sm transition duration-200"
                    >
                        🍅Tomato
                    </button>
                    <button
                        onclick="loadCustomModel('https://teachablemachine.withgoogle.com/models/C0AH6w8g3/', 'Potato')"
                        class="bg-white border border-blue-600 text-blue-700 hover:bg-orange-400 hover:text-white px-3 py-1.5 rounded-lg text-xs font-semibold shadow-sm transition duration-200"
                    >
                        🥔Potato
                    </button>
                    <button
                        onclick="loadCustomModel('https://teachablemachine.withgoogle.com/models/aoCUaFeyp/', 'Bell Pepper')"
                        class="bg-white border border-blue-600 text-blue-700 hover:bg-orange-400 hover:text-white px-3 py-1.5 rounded-lg text-xs font-semibold shadow-sm transition duration-200"
                    >
                       🫑bell Pepper  
                    </button>
                       <a href="Plant doctor AI.html">
<button  class="bg-white border border-blue-600 text-blue-700 hover:bg-orange-400 hover:text-white px-3 py-1.5 rounded-lg text-xs font-semibold shadow-sm transition duration-200"
                    >Go online! 🟢</button>
</a>
                </div>

                <!-- Active Model Text Display -->
                <div class="mb-4">
                    <span id="active-model-text" class="text-xs font-medium text-gray-500">
                        Active Model: <span class="font-bold text-gray-700">None Selected</span>
                    </span>
                </div>

                <!-- Dropzone / Image Upload -->
                   
                <div id="drop-zone" class="border-2 border-dashed border-green-300 rounded-xl p-6 text-center bg-green-50/40 hover:bg-green-50 transition duration-200 cursor-pointer flex flex-col items-center justify-center min-h-[180px]">
                    <input type="file" id="image-upload" accept="image/*" class="hidden" onchange="handleFileSelect(event)">
                    <div class="w-12 h-12 rounded-full bg-green-100 text-green-700 flex items-center justify-center mb-3">
                        <i class="fa-solid fa-cloud-arrow-up text-xl"></i>
                    </div>
                     
                    <p class="text-sm font-medium text-gray-700 mb-1">Drag & drop leaf photo here</p>
                    <p class="text-xs text-gray-400 mb-4">PNG, JPG, JPEG, WEBP</p>
                 <button onclick="document.getElementById('image-upload').click()" class="bg-white border border-green-600 text-green-700 hover:bg-green-600 hover:text-white px-4 py-2 rounded-lg text-xs font-semibold shadow-sm transition duration-200">
                        Browse File
                    </button>
                </div>
            </div>

            <!-- Demo Samples -->
            <div class="mt-6 pt-4 border-t border-gray-100">
                <span class="text-xs font-semibold text-purple-700 uppercase tracking-wider block mb-2"></span>
                <div class="grid grid-cols-3 gap-2">
                        <span class="text-xs font-medium text-gray-700 block group-hover:text-green-700"></span>
                
                        <span class="text-[10px] text-red-400 block"></span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Right Column: Image Preview & Results -->
        <div class="w-full md:w-1/2 p-6 md:p-8 bg-gray-50/50 flex flex-col justify-between">
            <div>
                <h2 class="text-lg font-bold text-gray-800 mb-4 flex items-center justify-between">
                    <span>Diagnosis Result</span>
                    <span id="loading-spinner" class="hidden text-green-700 text-sm animate-spin">
                        <i class="fa-solid fa-circle-notch"></i>
                    </span>
                </h2>

                <!-- Image Preview Area -->
                <div class="relative w-full h-52 rounded-xl bg-gray-100 overflow-hidden border border-gray-200 mb-6 flex items-center justify-center">
                    <img id="image-preview" src="#" alt="Leaf Preview" class="w-full h-full object-cover hidden">
                    <div id="preview-placeholder" class="text-center p-4">
                        <i class="fa-solid fa-leaf text-4xl text-gray-300 mb-2 block"></i>
                        <p class="text-xs text-gray-400">No image uploaded yet</p>
                    </div>
                </div>

                <!-- Diagnosis Output Container -->
                <div id="result-container" class="space-y-3 max-h-48 overflow-y-auto custom-scrollbar pr-1">
                    <div class="text-center py-6 text-gray-400 text-xs">
                        Upload an image or select a demo sample to see AI prediction scores.
                    </div>
                </div>
            </div>

            <!-- Footer Note -->
            <div class="mt-6 pt-3 border-t border-gray-200 text-center">
                <p class="text-[11px] text-gray-400">Powered by TensorFlow.js & Teachable Machine</p>
            </div>
        </div>

    </div>
    <script src="off plan.js"></script>

  
</body>
</html>
